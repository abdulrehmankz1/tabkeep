<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TabKeep, design prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Sora:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --dk-bg-primary:#0A0A0A; --dk-bg-surface:#161616; --dk-bg-elevated:#222222;
    --dk-text-primary:#FFFFFF; --dk-text-secondary:#A3A3A3; --dk-border:#2A2A2A;
    --dk-money-in:#22C55E; --dk-money-out:#EF4444; --dk-accent:#FFFFFF; --dk-warning:#F59E0B; --dk-info:#3B82F6;
    --lt-bg-primary:#FFFFFF; --lt-bg-surface:#F5F5F5; --lt-bg-elevated:#EFEFEF;
    --lt-text-primary:#0A0A0A; --lt-text-secondary:#525252; --lt-border:#E5E5E5;
    --lt-money-in:#16A34A; --lt-money-out:#DC2626; --lt-accent:#0A0A0A; --lt-warning:#F59E0B; --lt-info:#3B82F6;
    --chip-1:#8B5CF6; --chip-2:#EC4899; --chip-3:#14B8A6; --chip-4:#F97316; --chip-other:#6B7280;
  }
  *{box-sizing:border-box; -webkit-font-smoothing:antialiased;}
  body{margin:0; font-family:'Manrope',sans-serif; background:#0d0d0f; color:#e8e8e8;}
  .display{font-family:'Sora','Manrope',sans-serif; letter-spacing:-.02em;}
  .studio{display:flex; min-height:100vh;}
  .side{width:280px; flex:none; background:#141416; border-right:1px solid #232326; padding:20px 0; position:sticky; top:0; height:100vh; overflow-y:auto;}
  .side h1{font-size:15px; font-weight:700; margin:0 20px 2px; letter-spacing:.2px; font-family:'Sora','Manrope',sans-serif;}
  .side .sub{font-size:11px; color:#7a7a80; margin:0 20px 18px;}
  .grp{margin-bottom:6px;}
  .grp-label{font-size:10px; text-transform:uppercase; letter-spacing:.08em; color:#63636a; padding:10px 20px 6px;}
  .navitem{display:flex; align-items:center; gap:8px; padding:8px 20px; font-size:13px; color:#c7c7cc; cursor:pointer; border-left:2px solid transparent;}
  .navitem:hover{background:#1c1c1f;}
  .navitem.active{background:#1c1c1f; color:#fff; border-left-color:#fff; font-weight:500;}
  .stage{flex:1; padding:36px 40px; display:flex; flex-direction:column; align-items:center; gap:18px;}
  .stage-head{width:100%; max-width:900px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px;}
  .stage-title{font-size:18px; font-weight:600; color:#fff;}
  .stage-desc{font-size:12.5px; color:#8b8b91; max-width:520px; line-height:1.5;}
  .toolbar{display:flex; gap:8px; align-items:center;}
  .seg{display:flex; background:#1c1c1f; border:1px solid #2b2b2f; border-radius:8px; overflow:hidden;}
  .seg button{border:none; background:transparent; color:#9a9aa0; font-size:12px; padding:7px 12px; cursor:pointer; font-family:inherit;}
  .seg button.on{background:#2c2c30; color:#fff;}
  .frames{display:flex; gap:28px; flex-wrap:wrap; justify-content:center;}
  .phone-wrap{display:flex; flex-direction:column; align-items:center; gap:10px;}
  .phone-label{font-size:11px; color:#77777d; text-transform:uppercase; letter-spacing:.06em;}
  .phone{width:390px; height:844px; border-radius:44px; padding:12px; background:#000; box-shadow:0 30px 60px rgba(0,0,0,.5);}
  .screen{width:100%; height:100%; border-radius:34px; overflow:hidden; position:relative; background:var(--sbg); color:var(--stext); font-family:'Manrope',sans-serif;}
  .screen.light{--sbg:var(--lt-bg-primary); --ssurface:var(--lt-bg-surface); --selev:var(--lt-bg-elevated); --stext:var(--lt-text-primary); --stext2:var(--lt-text-secondary); --sborder:var(--lt-border); --smin:var(--lt-money-in); --smout:var(--lt-money-out); --saccent:var(--lt-accent); --swarn:var(--lt-warning); --sinfo:var(--lt-info); --sacctext:#fff;}
  .screen.dark{--sbg:var(--dk-bg-primary); --ssurface:var(--dk-bg-surface); --selev:var(--dk-bg-elevated); --stext:var(--dk-text-primary); --stext2:var(--dk-text-secondary); --sborder:var(--dk-border); --smin:var(--dk-money-in); --smout:var(--dk-money-out); --saccent:var(--dk-accent); --swarn:var(--dk-warning); --sinfo:var(--dk-info); --sacctext:#000;}
  .statusbar{height:44px; display:flex; align-items:center; justify-content:space-between; padding:0 22px; font-size:13px; font-weight:600;}
  .content{position:absolute; top:44px; left:0; right:0; bottom:0; overflow-y:auto; -ms-overflow-style:none; scrollbar-width:none;}
  .content::-webkit-scrollbar{display:none;}
  .px{padding-left:16px; padding-right:16px;}
  .card{background:var(--ssurface); border:1px solid var(--sborder); border-radius:16px;}
  .row{display:flex; align-items:center;}
  .btw{display:flex; align-items:center; justify-content:space-between;}
  .avatar{width:44px; height:44px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:600; color:#fff; flex:none;}
  .amt{font-variant-numeric:tabular-nums; font-family:'Sora','Manrope',sans-serif; letter-spacing:-.01em;}
  .field{background:var(--ssurface); border:1px solid var(--sborder); border-radius:12px; padding:11px 14px;}
  .field .lbl{font-size:11px; font-weight:600; letter-spacing:.02em; text-transform:uppercase; color:var(--stext2); margin-bottom:3px;}
  .field .val{font-size:15px; color:var(--stext2);}
  .tabbar{position:absolute; left:0; right:0; bottom:0; height:82px; background:var(--ssurface); border-top:1px solid var(--sborder); display:flex; padding-bottom:14px;}
  .tabitem{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; font-size:10.5px; color:var(--stext2);}
  .tabitem.on{color:var(--stext);}
  .tab-spacer{width:72px; flex:none;}
  .tab-add{position:absolute; left:50%; bottom:34px; transform:translateX(-50%); width:60px; height:60px; border-radius:50%; background:var(--saccent); color:var(--sacctext); display:flex; align-items:center; justify-content:center; box-shadow:0 8px 22px rgba(0,0,0,.45); border:4px solid var(--sbg); z-index:2;}
  .fab{position:absolute; right:16px; bottom:96px; width:56px; height:56px; border-radius:50%; background:var(--saccent); color:var(--sacctext); display:flex; align-items:center; justify-content:center; box-shadow:0 6px 16px rgba(0,0,0,.35);}
  .chip{display:inline-flex; align-items:center; gap:6px; padding:7px 13px; border-radius:999px; border:1px solid var(--sborder); font-size:12.5px; color:var(--stext2); white-space:nowrap;}
  .chip.on{border-color:var(--stext); color:var(--stext); font-weight:500;}
  .btn-primary{background:var(--saccent); color:var(--sacctext); border:none; border-radius:12px; font-size:15px; font-weight:600; padding:15px; width:100%; font-family:inherit;}
  .btn-secondary{background:transparent; color:var(--stext); border:1px solid var(--sborder); border-radius:12px; font-size:14px; font-weight:500; padding:13px; width:100%; font-family:inherit;}
  .kp-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px;}
  .kp-key{background:var(--ssurface); border-radius:12px; height:56px; display:flex; align-items:center; justify-content:center; font-size:22px; font-weight:500;}
  .divider{border:none; border-top:1px solid var(--sborder); margin:0;}
  .empty-wrap{display:flex; flex-direction:column; align-items:center; text-align:center; padding:70px 30px; gap:14px;}
  .sheet-overlay{position:absolute; inset:0; background:rgba(0,0,0,.55);}
  .sheet{position:absolute; left:0; right:0; bottom:0; background:var(--ssurface); border-radius:20px 20px 0 0; padding:10px 16px 24px;}
  .sheet-handle{width:36px; height:4px; border-radius:2px; background:var(--sborder); margin:0 auto 14px;}
  .icon{display:inline-flex; align-items:center; justify-content:center; flex:none;}
  .skel{background:linear-gradient(90deg, var(--ssurface) 25%, var(--selev) 37%, var(--ssurface) 63%); background-size:400% 100%; animation:sk 1.4s ease infinite; border-radius:8px;}
  @keyframes sk{0%{background-position:100% 50%} 100%{background-position:0 50%}}
  .footer-note{width:100%; max-width:900px; font-size:11.5px; color:#5f5f66; text-align:center; margin-top:4px;}
  .donut{width:170px; height:170px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex:none;}
  .donut-hole{width:118px; height:118px; border-radius:50%; background:var(--ssurface); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px;}
  .donut-legend{display:grid; grid-template-columns:1fr 1fr; gap:12px 16px;}
  .dl-row{display:flex; align-items:center; gap:8px; font-size:13px; min-width:0;}
  .dl-dot{width:10px; height:10px; border-radius:50%; flex:none;}
  .dl-name{color:var(--stext);}
  .dl-amt{margin-left:auto; color:var(--stext2); font-weight:600; font-size:12.5px; white-space:nowrap;}
</style>
</head>
<body>
<div class="studio">
  <div class="side" id="side"></div>
  <div class="stage" id="stage"></div>
</div>

<script>
/* ---------- ICONS (feather-style, currentColor) ---------- */
function icon(name, size){
  size = size || 20;
  const paths = {
    home:'<path d="M4 11.5 12 4l8 7.5"/><path d="M6 10v9a1 1 0 0 0 1 1h4v-6h2v6h4a1 1 0 0 0 1-1v-9"/>',
    users:'<circle cx="9" cy="8" r="3.2"/><path d="M2.5 20c0-3.5 2.9-6 6.5-6s6.5 2.5 6.5 6"/><path d="M16 8.2a3 3 0 1 1 0 .2"/><path d="M21.5 20c-.2-2.7-1.9-4.8-4.3-5.6"/>',
    chart:'<path d="M4 20V10"/><path d="M11 20V4"/><path d="M18 20v-7"/>',
    user:'<circle cx="12" cy="8" r="3.5"/><path d="M4.5 20c0-4 3.4-7 7.5-7s7.5 3 7.5 7"/>',
    plus:'<path d="M12 5v14"/><path d="M5 12h14"/>',
    camera:'<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7l1.6-2.5h4.8L16 7"/><circle cx="12" cy="13.5" r="3.5"/>',
    search:'<circle cx="10.5" cy="10.5" r="6.5"/><path d="M20 20l-4.8-4.8"/>',
    check:'<path d="M4 12.5l5 5L20 6.5"/>',
    x:'<path d="M5 5l14 14"/><path d="M19 5L5 19"/>',
    chevronleft:'<path d="M14.5 4.5L7 12l7.5 7.5"/>',
    chevronright:'<path d="M9.5 4.5L17 12l-7.5 7.5"/>',
    chevrondown:'<path d="M4.5 8.5L12 16l7.5-7.5"/>',
    arrowin:'<path d="M6 18L18 6"/><path d="M9 6h9v9"/>',
    arrowout:'<path d="M6 6l12 12"/><path d="M9 18H18V9"/>',
    receipt:'<path d="M6 2.5h12v19l-2.5-1.5-2.5 1.5-2.5-1.5-2.5 1.5-2.5-1.5z"/><path d="M9 8h6"/><path d="M9 12h6"/><path d="M9 16h4"/>',
    image:'<rect x="3" y="4.5" width="18" height="15" rx="2"/><circle cx="8.5" cy="10" r="1.7"/><path d="M21 16l-5.5-5.5L7 19"/>',
    edit:'<path d="M4 20l.9-3.8L16 5a2 2 0 0 1 3 3L8 19l-4 1z"/>',
    trash:'<path d="M5 7h14"/><path d="M9 7V4.5h6V7"/><path d="M7 7l1 13h8l1-13"/>',
    download:'<path d="M12 3v13"/><path d="M7 11l5 5 5-5"/><path d="M4.5 20h15"/>',
    phone:'<path d="M6 3.5h4l1.5 4.5-2.3 1.7a12 12 0 0 0 5.6 5.6l1.7-2.3 4.5 1.5v4a1.5 1.5 0 0 1-1.6 1.5A16 16 0 0 1 4.5 5.1 1.5 1.5 0 0 1 6 3.5z"/>',
    settings:'<circle cx="12" cy="12" r="3"/><path d="M19.4 13.5a7.9 7.9 0 0 0 0-3l2-1.5-2-3.4-2.4.9a8 8 0 0 0-2.6-1.5L14 2h-4l-.4 2.5a8 8 0 0 0-2.6 1.5l-2.4-.9-2 3.4 2 1.5a7.9 7.9 0 0 0 0 3l-2 1.5 2 3.4 2.4-.9a8 8 0 0 0 2.6 1.5L10 22h4l.4-2.5a8 8 0 0 0 2.6-1.5l2.4.9 2-3.4z"/>',
    logout:'<path d="M9 4H5.5A1.5 1.5 0 0 0 4 5.5v13A1.5 1.5 0 0 0 5.5 20H9"/><path d="M15 16l4-4-4-4"/><path d="M19 12H9"/>',
    sync:'<path d="M4 12a8 8 0 0 1 14-5.3L20 8"/><path d="M20 4v4h-4"/><path d="M20 12a8 8 0 0 1-14 5.3L4 16"/><path d="M4 20v-4h4"/>',
    share:'<circle cx="18" cy="5" r="2.3"/><circle cx="6" cy="12" r="2.3"/><circle cx="18" cy="19" r="2.3"/><path d="M8.1 10.8l7.8-4.3"/><path d="M8.1 13.2l7.8 4.3"/>',
    wifioff:'<path d="M3 8.5a15 15 0 0 1 5.5-3.4"/><path d="M9.8 3.9A15 15 0 0 1 21 8.5"/><path d="M6.5 12.2a10 10 0 0 1 3-1.8"/><path d="M14.5 10.4a10 10 0 0 1 3 1.8"/><path d="M9.8 15.8a5 5 0 0 1 4.4 0"/><circle cx="12" cy="19" r="1"/><path d="M2 2l20 20"/>',
    bell:'<path d="M6 10a6 6 0 0 1 12 0c0 4 1.5 5.5 1.5 5.5H4.5S6 14 6 10z"/><path d="M10 19a2 2 0 0 0 4 0"/>',
    lock:'<rect x="5" y="10.5" width="14" height="9.5" rx="2"/><path d="M8 10.5V7a4 4 0 0 1 8 0v3.5"/>',
    coffee:'<path d="M5 8h13v6a5 5 0 0 1-5 5H10a5 5 0 0 1-5-5z"/><path d="M18 9.5h1.5a2.3 2.3 0 0 1 0 4.6H18"/><path d="M8 3.5c-.6.7-.6 1.3 0 2"/><path d="M11.5 3.5c-.6.7-.6 1.3 0 2"/>',
    building:'<rect x="5" y="3" width="14" height="18" rx="1"/><path d="M9 7h1.2M14 7h1.2M9 11h1.2M14 11h1.2M9 15h1.2M14 15h1.2"/><path d="M10.5 21v-4h3v4"/>',
    zap:'<path d="M13 2 5 13h6l-1 9 8-11h-6z"/>',
    truck:'<rect x="2.5" y="7" width="11" height="9" rx="1"/><path d="M13.5 10.5H17l3 3V16h-6.5z"/><circle cx="6.5" cy="17.5" r="1.6"/><circle cx="16.5" cy="17.5" r="1.6"/>',
    calendar:'<rect x="4" y="5.5" width="16" height="15" rx="2"/><path d="M4 10h16"/><path d="M8 3.5v3.5M16 3.5v3.5"/>',
    clock:'<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>',
    google:'<path d="M21 12.2c0-.7-.1-1.4-.2-2H12v4h5a4.3 4.3 0 0 1-1.9 2.8v2.3h3a9 9 0 0 0 2.9-7.1z"/><path d="M12 21a8.6 8.6 0 0 0 6-2.2l-3-2.3a5.4 5.4 0 0 1-8-2.8H3.8v2.4A9 9 0 0 0 12 21z"/><path d="M7 13.7a5.4 5.4 0 0 1 0-3.4V8H3.8a9 9 0 0 0 0 8.1z"/><path d="M12 6.6a4.9 4.9 0 0 1 3.5 1.4l2.6-2.6A8.7 8.7 0 0 0 12 3a9 9 0 0 0-8.2 5l3.2 2.5A5.4 5.4 0 0 1 12 6.6z"/>',
    contacts:'<rect x="6" y="3" width="12" height="18" rx="2"/><circle cx="12" cy="9.5" r="2.3"/><path d="M8.5 16c.6-1.7 2-2.5 3.5-2.5s2.9.8 3.5 2.5"/>',
    warntri:'<path d="M12 4l9 15.5H3z"/><path d="M12 10v4"/><path d="M12 17h.01"/>',
    more:'<circle cx="6" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="18" cy="12" r="1.3"/>',
  };
  const d = paths[name] || '';
  return `<svg class="icon" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
}

/* ---------- DATA ---------- */
function fmt(n){
  const neg = n<0; n=Math.abs(n);
  return (neg?'-':'')+'Rs. '+n.toLocaleString('en-IN');
}
const CATS = [
  {name:'Food', icon:'coffee', color:'var(--chip-1)', total:12450},
  {name:'Rent', icon:'building', color:'var(--chip-2)', total:35000},
  {name:'Bills', icon:'zap', color:'var(--chip-3)', total:8200},
  {name:'Transport', icon:'truck', color:'var(--chip-4)', total:6300},
  {name:'Other', icon:'more', color:'var(--chip-other)', total:1900},
];
const RECENT = [
  {cat:'Food', color:'var(--chip-1)', icon:'coffee', note:'Lunch with Ali', time:'1:20 PM', amount:-850},
  {cat:'Transport', color:'var(--chip-4)', icon:'truck', note:'Careem ride', time:'11:05 AM', amount:-420},
  {cat:'Bills', color:'var(--chip-3)', icon:'zap', note:'Electricity bill', time:'Yesterday', amount:-6800},
  {cat:'Food', color:'var(--chip-1)', icon:'coffee', note:'Grocery run', time:'Yesterday', amount:-3200},
  {cat:'Rent', color:'var(--chip-2)', icon:'building', note:'July rent', time:'2 Jul', amount:-35000},
];
const PEOPLE = [
  {name:'Basit', balance:2000},
  {name:'Ali', balance:-500},
  {name:'Sarah', balance:0},
  {name:'Hamza', balance:4500},
  {name:'Zara', balance:-1200},
];
const AV_COLORS = ['#8B5CF6','#EC4899','#14B8A6','#F97316','#3B82F6','#EF4444'];
function avColor(name){ let h=0; for(const c of name) h+=c.charCodeAt(0); return AV_COLORS[h%AV_COLORS.length]; }
function initials(name){ return name.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase(); }

/* ---------- SHARED FRAGMENTS ---------- */
function statusbar(offline){
  return `<div class="statusbar">
    <span>9:41</span>
    <span style="display:flex; align-items:center; gap:6px;">
      ${offline?`<span style="display:flex;align-items:center;gap:4px;background:var(--ssurface);border:1px solid var(--sborder);padding:3px 9px;border-radius:999px;font-size:10.5px;font-weight:500;color:var(--swarn);"><span style="width:6px;height:6px;border-radius:50%;background:var(--swarn);"></span>Offline</span>`:''}
      <span>&#9679;&#9679;&#9679;</span>
    </span>
  </div>`;
}
function tabbar(active){
  const left  = [['home','Home','home'],['people','People','users']];
  const right = [['reports','Reports','chart'],['account','Account','user']];
  const item = ([id,label,ic])=>`<div class="tabitem ${active===id?'on':''}">${icon(ic,21)}<span>${label}</span></div>`;
  return `<div class="tab-add">${icon('plus',26)}</div>
  <div class="tabbar">
    ${left.map(item).join('')}
    <div class="tab-spacer"></div>
    ${right.map(item).join('')}
  </div>`;
}
function fab(expanded){
  if(!expanded) return `<div class="fab">${icon('plus',24)}</div>`;
  return `<div style="position:absolute; right:16px; bottom:172px; display:flex; flex-direction:column; align-items:flex-end; gap:10px;">
    <div class="row card" style="gap:8px; padding:10px 16px; border-radius:999px;"><span style="font-size:13px;">Scan receipt</span>${icon('camera',18)}</div>
    <div class="row card" style="gap:8px; padding:10px 16px; border-radius:999px;"><span style="font-size:13px;">Add expense</span>${icon('plus',18)}</div>
    <div class="fab">${icon('x',22)}</div>
  </div>`;
}
function donutCard(){
  const cats=[...CATS].sort((a,b)=>b.total-a.total);
  const total=cats.reduce((s,c)=>s+c.total,0);
  let acc=0; const stops=cats.map(c=>{const s=acc,e=acc+c.total/total*100;acc=e;return `${c.color} ${s}% ${e}%`;}).join(',');
  return `<div class="card" style="padding:20px 16px 18px;">
    <div style="display:flex;justify-content:center;margin-bottom:16px;">
      <div class="donut" style="background:conic-gradient(${stops});">
        <div class="donut-hole">
          <div class="amt" style="font-size:20px;font-weight:700;">${fmt(total)}</div>
          <div style="font-size:11px;color:var(--stext2);margin-top:1px;">spent in July</div>
        </div>
      </div>
    </div>
    <div class="donut-legend">
      ${cats.map(c=>`<div class="dl-row"><span class="dl-dot" style="background:${c.color};"></span><span class="dl-name">${c.name}</span><span class="amt dl-amt">${fmt(c.total)}</span></div>`).join('')}
    </div>
  </div>`;
}
function header(title, opts){
  opts = opts||{};
  return `<div class="btw px" style="height:56px;">
    ${opts.back?`<div class="icon">${icon('chevronleft',22)}</div>`:'<div style="width:22px"></div>'}
    <div class="display" style="font-size:17px; font-weight:700;">${title}</div>
    ${opts.right?opts.right:'<div style="width:22px"></div>'}
  </div>`;
}
function categoryDropdown(c, label){
  return `<div class="btw card" style="padding:12px 16px;margin-bottom:16px;">
    <div class="row" style="gap:10px;">
      <span style="width:22px;height:22px;border-radius:50%;background:${c.color};display:flex;align-items:center;justify-content:center;color:#fff;flex:none;">${icon(c.icon,12)}</span>

/* Logo mark: a bold "T" (Tab) whose stem flicks up into a rising check (Keep / tracked / money up).
   color = the T, accent = the flick. Reads as a lettermark and a checkmark at once, holds at 24px. */
function logoMarkSvg(color, size, accent){
  accent = accent || '#22C55E';
  return `<svg width="${size}" height="${size}" viewBox="0 0 32 32" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M7.5 9.5H24.5" stroke="${color}" stroke-width="3.6"/>
    <path d="M16 9.5V21.5" stroke="${color}" stroke-width="3.6"/>
    <path d="M16 21.5L25 12.2" stroke="${accent}" stroke-width="3.6"/>
  </svg>`;
}
function wordmark(size){
  size = size || 26;
  return `<div style="display:flex;align-items:center;gap:9px;">
    <div style="width:${size}px;height:${size}px;border-radius:${Math.round(size*0.32)}px;background:#0A0A0A;display:flex;align-items:center;justify-content:center;flex:none;box-shadow:0 1px 2px rgba(0,0,0,.25);">
      ${logoMarkSvg('#fff', Math.round(size*0.7))}
    </div>
    <span class="display" style="font-size:15px;font-weight:700;color:var(--stext);">TabKeep</span>
  </div>`;
}

/* Four candidate logo marks. color = main shape, accent = the money pop (green). viewBox 24, holds at 24px. */
function markSvg(id, color, size, accent){
  accent = accent || '#22C55E';
  const inner = {
    /* 1. Price tag with a punched coin-hole. tag = "tab", price = money. */
    tag:`<path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L2.5 12.5A2 2 0 0 1 2 11.2V4a2 2 0 0 1 2-2h7.2a2 2 0 0 1 1.3.5l7.1 7.1a2 2 0 0 1 0 2.8z" fill="${color}"/><circle cx="7.3" cy="7.3" r="1.9" fill="none" stroke="${accent}" stroke-width="1.9"/>`,
    /* 2. Bookmark ribbon, the tab you keep, with one green ledger entry. */
    bookmark:`<path d="M6 3h12a1.5 1.5 0 0 1 1.5 1.5V21l-7.5-4.9L4.5 21V4.5A1.5 1.5 0 0 1 6 3z" fill="${color}"/><path d="M8.4 9.4h7.2" stroke="${accent}" stroke-width="1.9" stroke-linecap="round"/>`,
    /* 3. TK monogram, T and K sharing one stem. */
    monogram:`<g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.6"><path d="M5 6H15" stroke="${color}"/><path d="M10 6V19" stroke="${color}"/><path d="M10 12.4 16.6 6" stroke="${color}"/><path d="M10 12.4 16.6 19" stroke="${accent}"/></g>`,
    /* 4. Coin holding a shrinking statement, money that's tracked. */
    coin:`<g fill="none" stroke-linecap="round" stroke-width="2"><circle cx="12" cy="12" r="9" stroke="${color}"/><path d="M8 9.7h8" stroke="${color}"/><path d="M8 12.5h8" stroke="${color}"/><path d="M8 15.3h5" stroke="${accent}"/></g>`,
  }[id] || '';
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none">${inner}</svg>`;
}
function logoTile(n, id, name, concept){
  return `<div style="display:flex;flex-direction:column;align-items:center;gap:11px;background:var(--ssurface);border:1px solid var(--sborder);border-radius:18px;padding:18px 12px 16px;">

/* ---------- WIRING ---------- */
const GROUPS = {A:'Onboarding & auth', B:'Core expense flow', C:'People / khata', D:'Reports', E:'OCR scanning', F:'Account & sync', G:'Logo & splash'};
let current = 'styleguide';
let theme = 'dark';
let state = 'default';

function renderSide(){
  const side = document.getElementById('side');
  let html = `<h1>TabKeep</h1><div class="sub">Design prototype &middot; 390&times;844</div>
    <div class="navitem ${current==='styleguide'?'active':''}" data-id="styleguide">${icon('settings',16)}&nbsp; Style guide</div>`;
  Object.keys(GROUPS).forEach(g=>{
    html += `<div class="grp-label">${GROUPS[g]}</div>`;
    SCREENS.filter(s=>s.group===g).forEach(s=>{
      html += `<div class="navitem ${current===s.id?'active':''}" data-id="${s.id}">${s.name}</div>`;
    });
  });
  side.innerHTML = html;
  side.querySelectorAll('.navitem').forEach(el=>{
    el.addEventListener('click', ()=>{ current = el.dataset.id; state='default'; render(); });
  });
}

function render(){
  renderSide();
  const stage = document.getElementById('stage');
  document.body.dataset.theme = theme;

  if(current==='styleguide'){
    stage.innerHTML = `
      <div class="stage-head">
        <div><div class="stage-title">Style guide</div><div class="stage-desc">Color tokens, typography, buttons, chips, avatars and the signature keypad component.</div></div>
        <div class="toolbar"><div class="seg" id="themeToggle"><button data-t="dark" class="${theme==='dark'?'on':''}">Dark</button><button data-t="light" class="${theme==='light'?'on':''}">Light</button></div></div>
      </div>
      <div class="frames"><div class="screen ${theme}" style="position:relative; width:820px; max-width:90vw; height:auto; border-radius:16px; padding:0;">${renderStyleGuide(theme)}</div></div>
    `;
    wireTheme();
    return;
  }

  const s = SCREENS.find(x=>x.id===current);
  const states = s.states ? ['default','empty','loading','error'] : ['default'];
  stage.innerHTML = `
    <div class="stage-head">
      <div><div class="stage-title">${s.name}</div><div class="stage-desc">Group ${s.group} &middot; ${GROUPS[s.group]}</div></div>
      <div class="toolbar">
        ${s.states ? `<div class="seg" id="stateToggle">${states.map(st=>`<button data-s="${st}" class="${state===st?'on':''}">${st[0].toUpperCase()+st.slice(1)}</button>`).join('')}</div>` : ''}
        <div class="seg" id="themeToggle"><button data-t="dark" class="${theme==='dark'?'on':''}">Dark</button><button data-t="light" class="${theme==='light'?'on':''}">Light</button></div>
      </div>
    </div>
    <div class="frames">
      <div class="phone-wrap">
        <div class="phone-label">${theme} &middot; ${state}</div>
        <div class="phone"><div class="screen ${theme}">${s.render(state)}</div></div>
      </div>
    </div>
    <div class="footer-note">This is a static prototype for review. Buttons and inputs are visual only.</div>
  `;
  wireTheme();
  const st = document.getElementById('stateToggle');
  if(st) st.querySelectorAll('button').forEach(b=>b.addEventListener('click', ()=>{ state=b.dataset.s; render(); }));
}

function wireTheme(){
  const tt = document.getElementById('themeToggle');
  if(tt) tt.querySelectorAll('button').forEach(b=>b.addEventListener('click', ()=>{ theme=b.dataset.t; render(); }));
}

render();
</script>
</body>
</html>
